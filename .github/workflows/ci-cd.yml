name: CICD

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 18.13.0
      - name: Installing dependencies
        run: npm i
      - name: Building
        run: npm run build --if-present
      # - name: Testing
      #   run: npm test
      - name: Deploy using serverless
        uses: serverless/github-action@v3.2
        with:
          args: -c "serverless deploy --stage qas"
          entrypoint: /bin/sh
        env:
          ACCESS_KEY_ID: ${{ secrets.AWS_IAM_KEY }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_IAM_SECRET }}
