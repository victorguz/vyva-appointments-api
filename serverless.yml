service: vyva-whatsapp
frameworkVersion: '3'

custom:
  sharedHttpApiId: ${ssm:/vyva/${self:provider.stage}/HTTP_API_ID}
  sharedAuthorizerId: ${ssm:/vyva/${self:provider.stage}/HTTP_API_AUTHORIZER_ID}
  corsAllowedOrigins: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_ORIGINS}
  corsAllowedMethods: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_METHODS}
  corsAllowedHeaders: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_HEADERS}
  campaignAllowedPhones:
    qas: '573002017402'
    prd: ''
    dev: '573002017402'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'qas'}
  region: us-east-1
  memorySize: 2048
  timeout: 30

  httpApi:
    id: ${self:custom.sharedHttpApiId}

  environment:
    NODE_ENV: ${self:provider.stage}
    CORS_ALLOWED_ORIGINS: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_ORIGINS}
    CORS_ALLOWED_METHODS: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_METHODS}
    CORS_ALLOWED_HEADERS: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_HEADERS}
    ACCESS_KEY_ID: ${ssm:/vyva/${self:provider.stage}/VYVA_ACCESS_KEY_ID}
    SECRET_ACCESS_KEY: ${ssm:/vyva/${self:provider.stage}/VYVA_SECRET_ACCESS_KEY}
    REGION: ${ssm:/vyva/${self:provider.stage}/VYVA_REGION}
    JWT_SECRET: ${ssm:/vyva/${self:provider.stage}/VYVA_JWT_SECRET}
    SECRET_KEY: ${ssm:/vyva/${self:provider.stage}/VYVA_SECRET_KEY}
    VYVAPOS_ID_BUSINESS: ${ssm:/vyva/${self:provider.stage}/VYVAPOS_ID_BUSINESS, ''}
    META_APP_ID: ${ssm:/vyva/${self:provider.stage}/META_APP_ID}
    META_APP_SECRET: ${ssm:/vyva/${self:provider.stage}/META_APP_SECRET}
    META_WEBHOOK_VERIFY_TOKEN: ${ssm:/vyva/${self:provider.stage}/META_WEBHOOK_VERIFY_TOKEN}
    META_SYSTEM_USER_ACCESS_TOKEN: ${ssm:/vyva/${self:provider.stage}/META_SYSTEM_USER_ACCESS_TOKEN, ''}
    META_OAUTH_REDIRECT_URI: ${ssm:/vyva/${self:provider.stage}/META_OAUTH_REDIRECT_URI}
    FRONTEND_URL: ${ssm:/vyva/${self:provider.stage}/VYVA_FRONTEND_URL}
    REALTIME_PUBLISH_URL: ${ssm:/vyva/${self:provider.stage}/REALTIME_PUBLISH_URL}
    REALTIME_PUBLISH_SECRET: ${ssm:/vyva/${self:provider.stage}/REALTIME_PUBLISH_SECRET}
    CAMPAIGN_DISPATCH_QUEUE_ARN: ${ssm:/vyva/${self:provider.stage}/CAMPAIGN_DISPATCH_QUEUE_ARN, ''}
    CAMPAIGN_QAS_ALLOWED_PHONES: ${self:custom.campaignAllowedPhones.${self:provider.stage}, ''}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
            - ssm:GetParametersByPath
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/vyva/${self:provider.stage}/*
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            # Conversations/messages always live in production tables
            - arn:aws:dynamodb:${self:provider.region}:*:table/prd-vyva-whatsapp-messages
            - arn:aws:dynamodb:${self:provider.region}:*:table/prd-vyva-whatsapp-messages/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/prd-vyva-whatsapp-conversations
            - arn:aws:dynamodb:${self:provider.region}:*:table/prd-vyva-whatsapp-conversations/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-integrations
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-integrations/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-users
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-users/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-domains
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-domains/*
        - Effect: Allow
          Action:
            - dynamodb:CreateTable
            - dynamodb:UpdateTable
            - dynamodb:DescribeTable
            - dynamodb:ListTables
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/prd-vyva-whatsapp-*
            - arn:aws:dynamodb:${self:provider.region}:*:table/prd-vyva-whatsapp-*/*
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource:
            - arn:aws:logs:${self:provider.region}:*:*

        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:UpdateItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-campaigns
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-campaigns/*

        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:ChangeMessageVisibility
          Resource:
            - ${ssm:/vyva/${self:provider.stage}/CAMPAIGN_DISPATCH_QUEUE_ARN, 'arn:aws:sqs:us-east-1:000000000000:placeholder'}

functions:
  preflight:
    handler: dist/preflight.handler
    memorySize: 128
    timeout: 5
    events:
      - httpApi:
          path: /api/whatsapp
          method: OPTIONS
      - httpApi:
          path: /api/whatsapp/{proxy+}
          method: OPTIONS
  api:
    handler: dist/lambda.handler
    layers:
      - arn:aws:lambda:us-east-1:754881596744:layer:vyva-appointments:1
    events:
      - httpApi:
          path: /api/whatsapp/webhook
          method: GET
      - httpApi:
          path: /api/whatsapp/webhook
          method: POST
      - httpApi:
          path: /api/whatsapp
          method: ANY
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}
      - httpApi:
          path: /api/whatsapp/{proxy+}
          method: ANY
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}

  campaignWorker:
    handler: dist/campaign-worker.handler
    memorySize: 512
    timeout: 30
    layers:
      - arn:aws:lambda:us-east-1:754881596744:layer:vyva-appointments:1
    events:
      - sqs:
          arn: ${ssm:/vyva/${self:provider.stage}/CAMPAIGN_DISPATCH_QUEUE_ARN}
          batchSize: 20
          maximumBatchingWindow: 10
          maximumConcurrency: 5
          functionResponseType: ReportBatchItemFailures

package:
  excludeDevDependencies: true
  patterns:
    - '!**'
    - 'dist/**'
