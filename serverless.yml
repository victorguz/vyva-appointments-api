service: vyva-appointments
frameworkVersion: '3'

custom:
  sharedHttpApiId: ${ssm:/vyva/${self:provider.stage}/HTTP_API_ID}
  sharedAuthorizerId: ${ssm:/vyva/${self:provider.stage}/HTTP_API_AUTHORIZER_ID}
  corsAllowedOrigins: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_ORIGINS}
  corsAllowedMethods: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_METHODS}
  corsAllowedHeaders: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_HEADERS}

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'qas'} # Default: qas (dev es solo local)
  region: us-east-1
  memorySize: 2048
  timeout: 30

  httpApi:
    id: ${self:custom.sharedHttpApiId}

  environment:
    NODE_ENV: ${self:provider.stage}
    CORS_ALLOWED_ORIGINS: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_ORIGINS}
    CORS_ALLOWED_METHODS: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_METHODS}
    CORS_ALLOWED_HEADERS: ${ssm:/vyva/${self:provider.stage}/CORS_ALLOWED_HEADERS}
    # Parámetros compartidos desde SSM
    ACCESS_KEY_ID: ${ssm:/vyva/${self:provider.stage}/VYVA_ACCESS_KEY_ID}
    SECRET_ACCESS_KEY: ${ssm:/vyva/${self:provider.stage}/VYVA_SECRET_ACCESS_KEY}
    REGION: ${ssm:/vyva/${self:provider.stage}/VYVA_REGION}
    # Parámetros necesarios para autenticación
    JWT_SECRET: ${ssm:/vyva/${self:provider.stage}/VYVA_JWT_SECRET}
    SECRET_KEY: ${ssm:/vyva/${self:provider.stage}/VYVA_SECRET_KEY}
    VYVAPOS_ID_BUSINESS: ${ssm:/vyva/${self:provider.stage}/VYVAPOS_ID_BUSINESS, ''}
    REALTIME_PUBLISH_URL: ${ssm:/vyva/${self:provider.stage}/REALTIME_PUBLISH_URL}
    REALTIME_PUBLISH_SECRET: ${ssm:/vyva/${self:provider.stage}/REALTIME_PUBLISH_SECRET}

  iam:
    role:
      statements:
        # Permisos para leer parámetros SSM
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
            - ssm:GetParametersByPath
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/vyva/${self:provider.stage}/*
        # Permisos para DynamoDB (appointments, customers, users, products)
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-appointments
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-appointments/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-customers
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-customers/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-users
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-users/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-products
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-products/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-businesses
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-businesses/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-sales-orders
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-sales-orders/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-domains
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-domains/*

        # Permisos para crear y modificar tablas DynamoDB
        - Effect: Allow
          Action:
            - dynamodb:CreateTable
            - dynamodb:UpdateTable
            - dynamodb:DescribeTable
            - dynamodb:ListTables
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-appointments
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-appointments/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-customers
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-customers/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-users
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-users/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-products
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-products/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-businesses
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-businesses/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-sales-orders
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-sales-orders/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-domains
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-vyva-domains/*

        # Permisos para invocar Lambda de integrations y del motor de automatizaciones
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${self:provider.region}:*:function:vyva-integrations-${self:provider.stage}-api
            - arn:aws:lambda:${self:provider.region}:*:function:vyva-domains-${self:provider.stage}-api
            - arn:aws:lambda:${self:provider.region}:*:function:vyva-whatsapp-${self:provider.stage}-api
            - arn:aws:lambda:${self:provider.region}:*:function:vyva-automations-${self:provider.stage}-invokeWebhook

        # Permisos para logs de CloudWatch
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource:
            - arn:aws:logs:${self:provider.region}:*:*

functions:
  preflight:
    handler: dist/src/preflight.handler
    memorySize: 128
    timeout: 5
    events:
      - httpApi:
          path: /api/appointments
          method: OPTIONS
      - httpApi:
          path: /api/appointments/{proxy+}
          method: OPTIONS
  api:
    handler: dist/src/lambda.handler
    layers:
      - arn:aws:lambda:us-east-1:754881596744:layer:vyva-appointments:1
    events:
      - httpApi:
          path: /api/appointments/public
          method: ANY
      - httpApi:
          path: /api/appointments/public/{proxy+}
          method: ANY
      - httpApi:
          path: /api/appointments
          method: GET
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}
      - httpApi:
          path: /api/appointments
          method: PUT
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}
      - httpApi:
          path: /api/appointments
          method: PATCH
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}
      - httpApi:
          path: /api/appointments
          method: DELETE
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}
      - httpApi:
          path: /api/appointments
          method: POST
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}
      - httpApi:
          path: /api/appointments/{proxy+}
          method: GET
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}
      - httpApi:
          path: /api/appointments/{proxy+}
          method: PUT
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}
      - httpApi:
          path: /api/appointments/{proxy+}
          method: PATCH
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}
      - httpApi:
          path: /api/appointments/{proxy+}
          method: DELETE
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}
      - httpApi:
          path: /api/appointments/{proxy+}
          method: POST
          authorizer:
            type: request
            id: ${self:custom.sharedAuthorizerId}

package:
  excludeDevDependencies: true
  patterns:
    - '!**'
    - 'dist/**'
